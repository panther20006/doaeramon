<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doraemon Motivation Reels</title>

    <link rel="stylesheet" href="css/motivation.css">
</head>

<body>

    <!-- =========================================
         DORAEMON BACKGROUND DECORATION
    ========================================== -->

    <div class="doraemon-bg">

        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>

        <div class="star star-1">✦</div>
        <div class="star star-2">✦</div>
        <div class="star star-3">✦</div>
        <div class="star star-4">✦</div>

        <div class="bg-text bg-text-1">
            DORAEMON
        </div>

        <div class="bg-text bg-text-2">
            MOTIVATION
        </div>

    </div>


    <!-- =========================================
         MAIN REELS
    ========================================== -->

    <main class="reels-container" id="reelsContainer">


        <!-- =====================================
             REEL 01
        ====================================== -->

        <section class="reel">

            <video
                class="reel-video"
                src="assets/videos/motivation-01.mp4"
                playsinline
                muted
                loop
                preload="metadata">
            </video>

            <div class="reel-actions">

                <!-- SHARE -->

                <button
                    class="action-btn share-btn"
                    data-video="motivation-01.mp4"
                    aria-label="Share Reel">

                    <span>↗</span>
                    <small>Share</small>

                </button>


                <!-- DOWNLOAD -->

                <a
                    class="action-btn download-btn"
                    href="assets/videos/motivation-01.mp4"
                    download="Doraemon-Motivation-01.mp4"
                    aria-label="Download Reel">

                    <span>↓</span>
                    <small>Download</small>

                </a>

            </div>

        </section>



        <!-- =====================================
             REEL 02
        ====================================== -->

        <section class="reel">

            <video
                class="reel-video"
                src="assets/videos/motivation-02.mp4"
                playsinline
                muted
                loop
                preload="metadata">
            </video>

            <div class="reel-actions">

                <button
                    class="action-btn share-btn"
                    data-video="motivation-02.mp4"
                    aria-label="Share Reel">

                    <span>↗</span>
                    <small>Share</small>

                </button>


                <a
                    class="action-btn download-btn"
                    href="assets/videos/motivation-02.mp4"
                    download="Doraemon-Motivation-02.mp4"
                    aria-label="Download Reel">

                    <span>↓</span>
                    <small>Download</small>

                </a>

            </div>

        </section>



        <!-- =====================================
             REEL 03
        ====================================== -->

        <section class="reel">

            <video
                class="reel-video"
                src="assets/videos/motivation-03.mp4"
                playsinline
                muted
                loop
                preload="metadata">
            </video>

            <div class="reel-actions">

                <button
                    class="action-btn share-btn"
                    data-video="motivation-03.mp4"
                    aria-label="Share Reel">

                    <span>↗</span>
                    <small>Share</small>

                </button>


                <a
                    class="action-btn download-btn"
                    href="assets/videos/motivation-03.mp4"
                    download="Doraemon-Motivation-03.mp4"
                    aria-label="Download Reel">

                    <span>↓</span>
                    <small>Download</small>

                </a>

            </div>

        </section>



        <!-- =====================================
             REEL 04
        ====================================== -->

        <section class="reel">

            <video
                class="reel-video"
                src="assets/videos/motivation-04.mp4"
                playsinline
                muted
                loop
                preload="metadata">
            </video>

            <div class="reel-actions">

                <button
                    class="action-btn share-btn"
                    data-video="motivation-04.mp4"
                    aria-label="Share Reel">

                    <span>↗</span>
                    <small>Share</small>

                </button>


                <a
                    class="action-btn download-btn"
                    href="assets/videos/motivation-04.mp4"
                    download="Doraemon-Motivation-04.mp4"
                    aria-label="Download Reel">

                    <span>↓</span>
                    <small>Download</small>

                </a>

            </div>

        </section>


    </main>



    <!-- =========================================
         DESKTOP UP / DOWN BUTTONS
    ========================================== -->

    <div class="desktop-navigation">

        


    </div>



    <!-- =========================================
         SHARE MESSAGE
    ========================================== -->

    <div id="shareMessage" class="share-message">
        Link copied!
    </div>



    <script src="js/motivation.js"></script>

</body>

</html>
