          class="reels-container">



        <!-- =================================================
             REEL 01
        ================================================== -->

        <section class="reel"
                 data-category="motivation"
                 data-index="0">

            <video class="reel-video"
                   src="assets/videos/compressed/motivation-01.mp4"
                   playsinline
                   webkit-playsinline
                   preload="metadata"
                   loop>
            </video>


            <div class="reel-gradient"></div>


            <!-- INSTAGRAM STYLE ACTIONS -->

            <div class="reel-actions">


                <!-- SHARE -->

                <button class="reel-action share-btn"
                        type="button"
                        aria-label="Share Reel">

                    <span class="action-icon">
                        ↗
                    </span>

                    <span class="action-text">
                        Share
                    </span>

                </button>



                <!-- DOWNLOAD -->

                <a class="reel-action download-btn"
                   href="assets/videos/compressed/motivation-01.mp4"
                   download
                   aria-label="Download Reel">

                    <span class="action-icon">
                        ↓
                    </span>

                    <span class="action-text">
                        Download
                    </span>

                </a>


            </div>
