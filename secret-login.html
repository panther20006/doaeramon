<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enter Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f9fc;
        }

        .password-box {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .password-box h1 {
            margin-bottom: 22px;
            color: #063b68;
            font-size: 25px;
            font-weight: 500;
        }

        #passwordInput {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
            text-align: center;
            background: white;
        }

        #passwordInput:focus {
            border-color: #087dcc;
            box-shadow: 0 0 0 3px rgba(8, 125, 204, 0.08);
        }

        #enterBtn {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #087dcc;
            font-size: 15px;
            transition: 0.2s;
        }

        #enterBtn:hover {
            background: #0669aa;
        }

        #errorMessage {
            min-height: 20px;
            margin-top: 10px;
            color: #e04f6f;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="password-box">

        <h1>Enter Your Password</h1>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
            autocomplete="off"
        >

        <button id="enterBtn">
            Enter
        </button>

        <p id="errorMessage"></p>

    </div>

    <script>

        const PASSWORD_1 = "doaremon123";

        const passwordInput =
            document.getElementById("passwordInput");

        const enterBtn =
            document.getElementById("enterBtn");

        const errorMessage =
            document.getElementById("errorMessage");


        function checkPassword() {

            const password =
                passwordInput.value.trim();

            if (password === PASSWORD_1) {

                sessionStorage.setItem(
                    "secretStep1",
                    "true"
                );

                window.location.href =
                    "mausam-password.html";

            } else {

                errorMessage.textContent =
                    "Wrong password.";

                passwordInput.value = "";

                passwordInput.focus();
            }
        }


        enterBtn.addEventListener(
            "click",
            checkPassword
        );


        passwordInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            }
        );


        window.addEventListener(
            "load",
            function() {
                passwordInput.focus();
            }
        );

    </script>

</body>
</html>
