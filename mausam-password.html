<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#087dcc">

    <title>For Mausam 🌸</title>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #29485d;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(32,168,245,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(255,170,200,.13),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8fcff,
                    #f1f9fd,
                    #fff9fb
                );

            overflow: hidden;
        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        .heart {
            position: fixed;

            color: rgba(8,125,204,.13);

            font-size: 30px;

            pointer-events: none;

            animation:
                floatHeart 5s ease-in-out infinite;
        }

        .heart-one {
            top: 15%;
            left: 12%;
        }

        .heart-two {
            top: 25%;
            right: 12%;

            font-size: 22px;

            animation-delay: 1s;
        }

        .heart-three {
            bottom: 17%;
            left: 18%;

            font-size: 22px;

            animation-delay: 2s;
        }

        .heart-four {
            bottom: 12%;
            right: 18%;

            animation-delay: 1.5s;
        }


        /* =========================
           PASSWORD CARD
        ========================= */

        .password-box {

            position: relative;

            width: 100%;
            max-width: 390px;

            padding: 45px 35px;

            text-align: center;

            background:
                rgba(255,255,255,.88);

            border:
                1px solid rgba(8,125,204,.10);

            border-radius: 22px;

            box-shadow:
                0 20px 60px
                rgba(35,90,120,.10);

            backdrop-filter: blur(12px);

            animation:
                cardAppear .6s ease;
        }


        /* =========================
           HEART
        ========================= */

        .main-heart {

            width: 70px;
            height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 22px;

            border-radius: 50%;

            font-size: 34px;

            background: #f5fbff;

            box-shadow:
                0 10px 30px
                rgba(8,125,204,.10);

            animation:
                heartBeat 2s infinite;
        }


        /* =========================
           SMALL TITLE
        ========================= */

        .small-title {

            color: #087dcc;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }


        /* =========================
           HEADING
        ========================= */

        .password-box h1 {

            color: #063b68;

            font-family: Georgia, serif;

            font-size: 30px;

            font-weight: 500;

            margin-bottom: 10px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .password-box .description {

            color: #8194a1;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 27px;
        }


        /* =========================
           INPUT
        ========================= */

        .input-wrapper {

            position: relative;

            width: 100%;
        }

        #passwordInput {

            width: 100%;

            padding: 14px 16px;

            border:
                1px solid #d5e4ec;

            border-radius: 9px;

            outline: none;

            color: #29485d;

            background: #fff;

            font-size: 14px;

            text-align: center;

            transition: .25s ease;
        }

        #passwordInput::placeholder {
            color: #a4b4be;
        }

        #passwordInput:focus {

            border-color:
                #20a8f5;

            box-shadow:
                0 0 0 4px
                rgba(32,168,245,.08);
        }


        /* =========================
           BUTTON
        ========================= */

        #enterBtn {

            width: 100%;

            margin-top: 12px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            color: #fff;

            background: #087dcc;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 22px
                rgba(8,125,204,.18);

            transition: .25s ease;
        }

        #enterBtn:hover {

            background: #0669aa;

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(8,125,204,.22);
        }

        #enterBtn:active {
            transform:
                translateY(0);
        }

        #enterBtn:disabled {

            opacity: .65;

            cursor:
                not-allowed;

            transform:
                none;
        }


        /* =========================
           MESSAGE
        ========================= */

        #errorMessage {

            min-height: 20px;

            margin-top: 13px;

            color: #e05b77;

            font-size: 12px;
        }


        /* =========================
           BOTTOM TEXT
        ========================= */

        .bottom-text {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(8,125,204,.08);

            color: #9aaab4;

            font-size: 11px;

            line-height: 1.7;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    translateY(18px)
                    scale(.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes heartBeat {

            0%,100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.08);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.06);
            }

            60% {
                transform: scale(1);
            }
        }


        @keyframes floatHeart {

            0%,100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-18px)
                    rotate(8deg);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width:600px) {

            body {
                padding: 18px;
            }

            .password-box {

                max-width: 360px;

                padding:
                    38px 22px;
            }

            .main-heart {

                width: 64px;
                height: 64px;

                font-size: 31px;

                margin-bottom: 19px;
            }

            .password-box h1 {
                font-size: 27px;
            }

            .password-box .description {

                font-size: 12.5px;

                margin-bottom: 24px;
            }

            #passwordInput {
                padding: 13px;
            }

            #enterBtn {
                padding: 13px;
            }

            .heart-one {
                left: 5%;
            }

            .heart-two {
                right: 5%;
            }

            .heart-three {
                left: 8%;
            }

            .heart-four {
                right: 8%;
            }
        }


        @media (max-width:380px) {

            .password-box {
                padding: 32px 18px;
            }

            .password-box h1 {
                font-size: 25px;
            }

            .main-heart {

                width: 58px;
                height: 58px;

                font-size: 28px;
            }
        }

    </style>

</head>


<body>

    <div class="heart heart-one">♡</div>
    <div class="heart heart-two">♡</div>
    <div class="heart heart-three">♡</div>
    <div class="heart heart-four">♡</div>


    <div class="password-box">

        <div class="main-heart">
            💙
        </div>

        <div class="small-title">
            A LITTLE SECRET
        </div>

        <h1>
            For Mausam 🌸
        </h1>

        <p class="description">
            One more little step<br>
            before you enter your special place.
        </p>


        <div class="input-wrapper">

            <input
                type="password"
                id="passwordInput"
                placeholder="Enter your password"
                autocomplete="off"
                spellcheck="false">

        </div>


        <button id="enterBtn">
            Enter 💙
        </button>


        <p id="errorMessage"></p>


        <div class="bottom-text">

            Some things are worth keeping
            just a little bit special. 🌸

        </div>

    </div>


    <script>

        /* =========================================
           PASSWORD
        ========================================= */

        const PASSWORD_2 = "2352006";


        /* =========================================
           EMAILJS CONFIG
        ========================================= */

        const EMAILJS_PUBLIC_KEY =
            "ItndrW1BubVRc_n0A";

        const EMAILJS_SERVICE_ID =
            "service_27ulio7";

        const EMAILJS_TEMPLATE_ID =
            "template_n3gwhmm";


        /* =========================================
           EMAILJS INITIALIZE
        ========================================= */

        emailjs.init({
            publicKey: EMAILJS_PUBLIC_KEY
        });


        /* =========================================
           CHECK FIRST PASSWORD
        ========================================= */

        if (
            sessionStorage.getItem("secretStep1")
            !== "true"
        ) {

            window.location.replace(
                "secret-login.html"
            );
        }


        /* =========================================
           ELEMENTS
        ========================================= */

        const passwordInput =
            document.getElementById(
                "passwordInput"
            );

        const enterBtn =
            document.getElementById(
                "enterBtn"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        /* =========================================
           SEND SUCCESS EMAIL
        ========================================= */

        function sendSuccessEmail() {

            const templateParams = {

                name: "Mausam",

                answer:
                    "Second password entered correctly 💙",

                message:
                    "Mausam entered the correct second password and unlocked the secret page.",

                time:
                    new Date().toLocaleString()
            };


            return emailjs.send(

                EMAILJS_SERVICE_ID,

                EMAILJS_TEMPLATE_ID,

                templateParams

            );

        }


        /* =========================================
           CHECK PASSWORD
        ========================================= */

        function checkPassword() {

            const password =
                passwordInput.value.trim();


            /* WRONG PASSWORD */

            if (password !== PASSWORD_2) {

                errorMessage.textContent =
                    "Wrong password. Please try again.";

                passwordInput.value = "";

                passwordInput.focus();

                return;
            }


            /* CORRECT PASSWORD */

            enterBtn.disabled = true;

            enterBtn.textContent =
                "Opening... 💙";

            errorMessage.style.color =
                "#087dcc";

            errorMessage.textContent =
                "Password correct... 💙";


            /*
               Send email first.
               Then open secret page.
            */

            sendSuccessEmail()

                .then(function () {

                    sessionStorage.setItem(
                        "secretUnlocked",
                        "true"
                    );

                    sessionStorage.removeItem(
                        "secretStep1"
                    );

                    window.location.href =
                        "secret.html";

                })

                .catch(function (error) {

                    console.error(
                        "EmailJS Error:",
                        error
                    );

                    /*
                       Even if email fails,
                       password is still correct.
                    */

                    sessionStorage.setItem(
                        "secretUnlocked",
                        "true"
                    );

                    sessionStorage.removeItem(
                        "secretStep1"
                    );

                    window.location.href =
                        "secret.html";

                });
        }


        /* =========================================
           BUTTON CLICK
        ========================================= */

        enterBtn.addEventListener(
            "click",
            checkPassword
        );


        /* =========================================
           ENTER KEY
        ========================================= */

        passwordInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    checkPassword();

                }

            }
        );


        /* =========================================
           AUTO FOCUS
        ========================================= */

        window.addEventListener(
            "load",
            function () {

                passwordInput.focus();

            }
        );

    </script>

</body>

</html>
